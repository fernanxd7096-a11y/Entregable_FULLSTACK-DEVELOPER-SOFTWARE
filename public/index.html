<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nova Salud - Sistema de Gestión de Botica. Inicie sesión para administrar inventario, ventas y más.">
    <title>Nova Salud - Iniciar Sesión</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-logo">
                <span class="logo-icon">💊</span>
                <h1>Nova Salud</h1>
                <p>Sistema de Gestión de Botica</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="admin@novasalud.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    Iniciar Sesión
                </button>
            </form>
            <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-muted)">
                Credenciales: admin@novasalud.com / admin123
            </p>
        </div>
    </div>
    <script src="/js/api.js"></script>
    <script>
        if (isAuthenticated()) window.location.href = '/dashboard';
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Ingresando...';
            btn.disabled = true;
            try {
                const data = await api.login(
                    document.getElementById('email').value,
                    document.getElementById('password').value
                );
                setAuth(data.token, data.user);
                window.location.href = '/dashboard';
            } catch (error) {
                showToast(error.message, 'error');
                btn.textContent = 'Iniciar Sesión';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
