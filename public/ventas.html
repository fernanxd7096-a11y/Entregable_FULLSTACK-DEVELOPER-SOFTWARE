<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Nova Salud</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <div class="page-header">
                <div><h2>🛒 Punto de Venta</h2><p>Registro rápido de ventas</p></div>
            </div>
            <div class="pos-layout">
                <div class="pos-products">
                    <div class="filter-bar">
                        <div class="search-box"><input type="text" class="form-control" id="posSearch" placeholder="Buscar producto..." oninput="filterProducts()"></div>
                        <select class="form-control filter-select" id="posCat" onchange="filterProducts()"><option value="">Todas</option></select>
                    </div>
                    <div class="product-grid" id="posGrid"></div>
                </div>
                <div class="pos-cart card">
                    <div class="card-header"><h3>🧾 Carrito de Venta</h3></div>
                    <div class="card-body" style="padding:0">
                        <div style="padding:12px 16px">
                            <div class="form-group" style="margin-bottom:8px"><input type="text" class="form-control" id="clienteNombre" placeholder="Nombre del cliente (opcional)"></div>
                            <div class="form-row" style="gap:8px">
                                <div class="form-group" style="margin-bottom:0"><input type="text" class="form-control" id="clienteDni" placeholder="DNI (opcional)"></div>
                                <div class="form-group" style="margin-bottom:0">
                                    <select class="form-control" id="metodoPago">
                                        <option value="efectivo">💵 Efectivo</option>
                                        <option value="tarjeta">💳 Tarjeta</option>
                                        <option value="yape">📱 Yape</option>
                                        <option value="plin">📱 Plin</option>
                                        <option value="transferencia">🏦 Transferencia</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="cart-items" id="cartItems">
                            <div class="empty-state" style="padding:32px"><div class="empty-icon">🛒</div><p>Agrega productos al carrito</p></div>
                        </div>
                    </div>
                    <div class="cart-summary">
                        <div class="summary-row"><span>Subtotal</span><span id="cartSubtotal">S/ 0.00</span></div>
                        <div class="summary-row"><span>IGV (18%)</span><span id="cartIgv">S/ 0.00</span></div>
                        <div class="summary-row total"><span>Total</span><span id="cartTotal">S/ 0.00</span></div>
                        <button class="btn btn-success btn-block" style="margin-top:16px" onclick="processSale()" id="saleBtn">✅ Registrar Venta</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        if (!checkAuth()) window.location.href = '/';
        loadSidebar('ventas');

        let allProducts = [];
        let cart = [];

        async function init() {
            const cats = await api.getCategorias();
            document.getElementById('posCat').innerHTML = '<option value="">Todas</option>' + cats.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
            allProducts = await api.getProductos();
            renderProducts(allProducts);
        }

        function filterProducts() {
            const s = document.getElementById('posSearch').value.toLowerCase();
            const c = document.getElementById('posCat').value;
            let filtered = allProducts;
            if (s) filtered = filtered.filter(p => p.nombre.toLowerCase().includes(s));
            if (c) filtered = filtered.filter(p => p.categoria_id == c);
            renderProducts(filtered);
        }

        function renderProducts(products) {
            const grid = document.getElementById('posGrid');
            if (products.length === 0) { grid.innerHTML = '<div class="empty-state"><p>No se encontraron productos</p></div>'; return; }
            grid.innerHTML = products.map(p => {
                const cls = p.stock <= 0 ? 'no-stock' : p.stock <= p.stock_minimo ? 'low-stock' : '';
                return `<div class="product-card ${cls}" onclick="addToCart(${p.id})">
                    <div class="p-name">${p.nombre}</div>
                    <div class="p-price">${formatCurrency(p.precio_venta)}</div>
                    <div class="p-stock">Stock: ${p.stock}</div>
                </div>`;
            }).join('');
        }

        function addToCart(productId) {
            const product = allProducts.find(p => p.id === productId);
            if (!product || product.stock <= 0) return;
            const existing = cart.find(i => i.producto_id === productId);
            if (existing) {
                if (existing.cantidad >= product.stock) { showToast('Stock insuficiente', 'error'); return; }
                existing.cantidad++;
            } else {
                cart.push({ producto_id: productId, nombre: product.nombre, precio_unitario: parseFloat(product.precio_venta), cantidad: 1, stock: product.stock });
            }
            renderCart();
        }

        function updateQty(productId, delta) {
            const item = cart.find(i => i.producto_id === productId);
            if (!item) return;
            item.cantidad += delta;
            if (item.cantidad <= 0) { cart = cart.filter(i => i.producto_id !== productId); }
            else if (item.cantidad > item.stock) { item.cantidad = item.stock; showToast('Stock máximo alcanzado', 'error'); }
            renderCart();
        }

        function removeFromCart(productId) { cart = cart.filter(i => i.producto_id !== productId); renderCart(); }

        function renderCart() {
            const el = document.getElementById('cartItems');
            if (cart.length === 0) {
                el.innerHTML = '<div class="empty-state" style="padding:32px"><div class="empty-icon">🛒</div><p>Agrega productos</p></div>';
            } else {
                el.innerHTML = cart.map(i => `<div class="cart-item">
                    <div class="ci-name">${i.nombre}</div>
                    <div class="ci-qty"><button onclick="updateQty(${i.producto_id},-1)">−</button><span>${i.cantidad}</span><button onclick="updateQty(${i.producto_id},1)">+</button></div>
                    <div class="ci-price">${formatCurrency(i.precio_unitario * i.cantidad)}</div>
                    <span class="ci-remove" onclick="removeFromCart(${i.producto_id})">✕</span>
                </div>`).join('');
            }
            const subtotal = cart.reduce((s, i) => s + i.precio_unitario * i.cantidad, 0);
            const igv = subtotal * 0.18;
            document.getElementById('cartSubtotal').textContent = formatCurrency(subtotal);
            document.getElementById('cartIgv').textContent = formatCurrency(igv);
            document.getElementById('cartTotal').textContent = formatCurrency(subtotal + igv);
        }

        async function processSale() {
            if (cart.length === 0) { showToast('Agrega productos al carrito', 'error'); return; }
            const btn = document.getElementById('saleBtn');
            btn.disabled = true; btn.textContent = 'Procesando...';
            try {
                const data = {
                    cliente_nombre: document.getElementById('clienteNombre').value || 'Cliente General',
                    cliente_dni: document.getElementById('clienteDni').value || null,
                    metodo_pago: document.getElementById('metodoPago').value,
                    items: cart.map(i => ({ producto_id: i.producto_id, cantidad: i.cantidad, precio_unitario: i.precio_unitario }))
                };
                const result = await api.createVenta(data);
                showToast(`Venta #${result.id} registrada - Total: ${formatCurrency(result.total)}`);
                cart = [];
                renderCart();
                document.getElementById('clienteNombre').value = '';
                document.getElementById('clienteDni').value = '';
                allProducts = await api.getProductos();
                filterProducts();
            } catch (e) { showToast(e.message, 'error'); }
            btn.disabled = false; btn.textContent = '✅ Registrar Venta';
        }

        init();
    </script>
</body>
</html>
