<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Ventas - Nova Salud</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-content">
            <div class="page-header">
                <div><h2>📋 Historial de Ventas</h2><p>Registro completo de transacciones</p></div>
            </div>
            <div class="filter-bar">
                <div class="form-group" style="margin-bottom:0"><label style="font-size:11px;margin-bottom:4px">Desde</label><input type="date" class="form-control" id="fechaInicio" onchange="loadVentas()"></div>
                <div class="form-group" style="margin-bottom:0"><label style="font-size:11px;margin-bottom:4px">Hasta</label><input type="date" class="form-control" id="fechaFin" onchange="loadVentas()"></div>
                <button class="btn btn-outline" onclick="clearFilters()" style="align-self:flex-end">Limpiar</button>
            </div>
            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead><tr><th>#</th><th>Fecha</th><th>Cliente</th><th>Vendedor</th><th>Método</th><th>Subtotal</th><th>IGV</th><th>Total</th><th>Acciones</th></tr></thead>
                        <tbody id="ventasTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Detalle -->
    <div class="modal-overlay" id="detalleModal">
        <div class="modal">
            <div class="modal-header"><h3>Detalle de Venta</h3><button class="modal-close" onclick="document.getElementById('detalleModal').classList.remove('active')">✕</button></div>
            <div class="modal-body" id="detalleBody"></div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/sidebar.js"></script>
    <script>
        if (!checkAuth()) window.location.href = '/';
        loadSidebar('historial');

        async function loadVentas() {
            const fi = document.getElementById('fechaInicio').value;
            const ff = document.getElementById('fechaFin').value;
            let params = [];
            if (fi) params.push('fecha_inicio=' + fi);
            if (ff) params.push('fecha_fin=' + ff);
            try {
                const ventas = await api.getVentas(params.join('&'));
                const tbody = document.getElementById('ventasTable');
                if (ventas.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">📋</div><p>No se encontraron ventas</p></div></td></tr>';
                    return;
                }
                const metodoLabels = { efectivo: '💵 Efectivo', tarjeta: '💳 Tarjeta', yape: '📱 Yape', plin: '📱 Plin', transferencia: '🏦 Transferencia' };
                tbody.innerHTML = ventas.map(v => `<tr>
                    <td><strong>#${v.id}</strong></td>
                    <td>${formatDateTime(v.fecha_venta)}</td>
                    <td>${v.cliente_nombre}${v.cliente_dni ? '<br><small style="color:var(--text-muted)">DNI: ' + v.cliente_dni + '</small>' : ''}</td>
                    <td>${v.vendedor_nombre || '-'}</td>
                    <td><span class="badge badge-info">${metodoLabels[v.metodo_pago] || v.metodo_pago}</span></td>
                    <td>${formatCurrency(v.subtotal)}</td>
                    <td>${formatCurrency(v.igv)}</td>
                    <td><strong style="color:var(--accent)">${formatCurrency(v.total)}</strong></td>
                    <td><button class="btn btn-sm btn-outline" onclick="verDetalle(${v.id})">👁️ Ver</button></td>
                </tr>`).join('');
            } catch (e) { showToast('Error cargando ventas', 'error'); }
        }

        async function verDetalle(id) {
            try {
                const venta = await api.getVenta(id);
                document.getElementById('detalleBody').innerHTML = `
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
                        <div><strong>Venta #${venta.id}</strong><br><small style="color:var(--text-muted)">${formatDateTime(venta.fecha_venta)}</small></div>
                        <div style="text-align:right"><strong style="font-size:20px;color:var(--accent)">${formatCurrency(venta.total)}</strong></div>
                        <div><span style="color:var(--text-secondary)">Cliente:</span> ${venta.cliente_nombre}</div>
                        <div><span style="color:var(--text-secondary)">Método:</span> ${venta.metodo_pago}</div>
                    </div>
                    <table><thead><tr><th>Producto</th><th>Cant.</th><th>P. Unit.</th><th>Subtotal</th></tr></thead>
                    <tbody>${venta.detalles.map(d => `<tr><td>${d.producto_nombre || 'Producto eliminado'}</td><td>${d.cantidad}</td><td>${formatCurrency(d.precio_unitario)}</td><td>${formatCurrency(d.subtotal)}</td></tr>`).join('')}</tbody></table>
                    <div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
                        <div class="summary-row"><span>Subtotal</span><span>${formatCurrency(venta.subtotal)}</span></div>
                        <div class="summary-row"><span>IGV (18%)</span><span>${formatCurrency(venta.igv)}</span></div>
                        <div class="summary-row total"><span>Total</span><span>${formatCurrency(venta.total)}</span></div>
                    </div>`;
                document.getElementById('detalleModal').classList.add('active');
            } catch (e) { showToast('Error al cargar detalle', 'error'); }
        }

        function clearFilters() {
            document.getElementById('fechaInicio').value = '';
            document.getElementById('fechaFin').value = '';
            loadVentas();
        }

        loadVentas();
    </script>
</body>
</html>
